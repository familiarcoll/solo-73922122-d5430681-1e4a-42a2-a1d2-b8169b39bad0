services:
  api:
    build: .
    image: climate-station-extract:1.0.0
    container_name: climate-station-extract
    ports:
      - "8000:8000"
    environment:
      APP_DATA_DIR: /data
      APP_MAX_UPLOAD_BYTES: "33554432"      # 32 MiB
      APP_MAX_STATIONS: "100"
      APP_MAX_PARALLEL_TASKS: "2"
      APP_TASK_TIMEOUT_SECONDS: "60"
      APP_CHUNK_SIZE: "10"
    volumes:
      - climate_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  climate_data:
